# MiniGameHub production stack for the Ubuntu VM (Docker Engine already installed).
#
#   cp .env.example .env            # then edit: secrets, origins, bind address
#   docker compose --env-file .env -f infra/docker/compose.prod.yml config      # validate
#   docker compose --env-file .env -f infra/docker/compose.prod.yml up -d --build
#
# Public TLS is terminated by the EXISTING Nginx (see infra/nginx/), which forwards
# backend.opop.eu.org to this VM on port 2567. No reverse proxy is started here.
# PostgreSQL is only on the private compose network: it is never published to the host.

name: minigamehub

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minigamehub
      POSTGRES_USER: mgh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mgh -d minigamehub']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits: { cpus: '2', memory: 1g }

  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: minigamehub-server:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '2567'
      HOST: 0.0.0.0
      DATABASE_URL: postgres://mgh:${POSTGRES_PASSWORD}@postgres:5432/minigamehub
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (>= 32 chars)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://trazhub.github.io}
      TRUST_PROXY: 'true'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MAX_ROOMS: ${MAX_ROOMS:-500}
    # Published to the LAN address only (so the Nginx host can reach it), never 0.0.0.0.
    # NOTE: Docker-published ports bypass UFW; restrict the source with the DOCKER-USER rule in
    # docs/VM_DEPLOYMENT.md.
    ports:
      - '${SERVER_BIND:-127.0.0.1}:2567:2567'
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '4', memory: 2g }

  # Nightly logical backups with retention. Restore: docs/BACKUP_RESTORE.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: mgh
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: minigamehub
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_DIR:-/opt/minigamehub/backups}:/backups
      - ../scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['/bin/sh', '-c', 'while true; do /bin/sh /usr/local/bin/backup.sh; sleep "$$BACKUP_INTERVAL_SECONDS"; done']
    networks: [internal]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '1', memory: 256m }

  # Secondary option when the origin cannot be reached by Nginx directly: a Cloudflare Tunnel.
  # Not started by default.  docker compose --profile tunnel up -d   (docs/CLOUDFLARE_TUNNEL.md)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [server]
    networks: [internal]
    logging: *logging

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
