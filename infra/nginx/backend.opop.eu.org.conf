# Nginx site for the MiniGameHub backend. Install on the EXISTING public Nginx server:
#   sudo cp backend.opop.eu.org.conf /etc/nginx/sites-available/backend.opop.eu.org.conf
#   sudo ln -s /etc/nginx/sites-available/backend.opop.eu.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Forwards https://backend.opop.eu.org (HTTP + WebSocket) to the game VM at 10.10.42.88:2567.
# Adjust the certificate paths to however TLS is already managed on that Nginx host.
# Review before enabling: it touches a shared proxy, so nothing here is applied automatically.

# WebSocket upgrade: only send "Connection: upgrade" when the client asked for it.
# (If another site already defines $connection_upgrade, delete this block.)
map $http_upgrade $mgh_connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP request budgets in front of the app's own limits (defence in depth).
limit_req_zone $binary_remote_addr zone=mgh_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mgh_match:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mgh_conn:10m;

upstream mgh_backend {
    server 10.10.42.88:2567;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name backend.opop.eu.org;

    # Keep ACME HTTP-01 working if certbot manages this name; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backend.opop.eu.org;

    ssl_certificate     /etc/letsencrypt/live/backend.opop.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.opop.eu.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The app serves tiny JSON bodies only.
    client_max_body_size 4k;
    limit_conn mgh_conn 40;

    # Never expose the metrics endpoint publicly (it is for the VM's own monitoring).
    location = /metrics { return 404; }

    # Guest sessions, room lookup, stats.
    location /api/ {
        limit_req zone=mgh_api burst=40 nodelay;
        include /etc/nginx/snippets/mgh_proxy_params.conf;
    }

    # Colyseus matchmaking (HTTP).
    location /matchmake/ {
        limit_req zone=mgh_match burst=20 nodelay;
        include /etc/nginx/snippets/mgh_proxy_params.conf;
    }

    location = /health {
        include /etc/nginx/snippets/mgh_proxy_params.conf;
    }

    # Everything else is the Colyseus WebSocket endpoint (wss://backend.opop.eu.org/<processId>/<roomId>?...).
    location / {
        include /etc/nginx/snippets/mgh_proxy_params.conf;
    }
}
