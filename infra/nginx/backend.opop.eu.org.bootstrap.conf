# STAGE 1 (HTTP only). Lets you test the proxy and issue the TLS certificate before the HTTPS
# block exists. install-proxy-host.sh replaces this file with backend.opop.eu.org.conf in stage 2.
# Forwards http://backend.opop.eu.org to the game VM at 10.10.15.254:2567.

map $http_upgrade $mgh_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mgh_backend {
    server 10.10.15.254:2567;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name backend.opop.eu.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location = /metrics { return 404; }

    location / {
        include /etc/nginx/snippets/mgh_proxy_params.conf;
    }
}
