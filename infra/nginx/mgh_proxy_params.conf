# Shared proxy settings. Install as /etc/nginx/snippets/mgh_proxy_params.conf
proxy_pass http://mgh_backend;
proxy_http_version 1.1;

# WebSocket support
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $mgh_connection_upgrade;

proxy_set_header Host $host;
# OVERWRITE (never append to) the forwarded address: the game server trusts X-Forwarded-For
# for per-IP rate limits, so a client-supplied value must never survive.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Long-lived sockets: the game server pings every 5s, so idle timeouts are generous.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 5s;
proxy_buffering off;
