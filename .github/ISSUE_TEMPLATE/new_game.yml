name: New game idea
description: Propose a new mini-game
labels: [new-game]
body:
  - type: markdown
    attributes:
      value: |
        Games must be **original**: original name, art, sound and levels. Mechanics are free to reuse, branded
        names and characters are not. See docs/LEGAL.md.
  - type: input
    id: name
    attributes:
      label: Working title
      description: An original, descriptive name. No existing trademarks.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Together (turn-based, server-run)
        - Arcade (browser-run, seeded, server-verified)
        - Action (real-time, server-authoritative)
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players
      placeholder: 2-8, or solo
  - type: textarea
    id: pitch
    attributes:
      label: How does it play?
      description: Core loop, how a round is won, and how long a round takes.
    validations:
      required: true
  - type: checkboxes
    id: originality
    attributes:
      label: Originality
      options:
        - label: The name, art, sound and level layouts will be my own work, not copied from an existing game.
          required: true
        - label: I have read docs/ADDING_A_GAME.md.
          required: true
