name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems do **not** use an issue: see SECURITY.md and use a private advisory.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room
        2. ...
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game or page
      description: Which game or screen was involved?
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 130 on Android 15
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Please remove anything private first.
